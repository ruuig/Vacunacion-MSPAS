# Despliegue en Render (plan gratuito): un servicio web que sirve la API y el frontend compilado,
# y una base PostgreSQL. En Render: New → Blueprint → elegir este repositorio.
services:
  - type: web
    name: vacunacion-mspas
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci
    startCommand: cd backend && npm run db:preparar && npm start
    healthCheckPath: /api/auth/ping
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vacunacion-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USUARIO
        value: admin
      - key: ADMIN_CONTRASENA
        sync: false   # Render la pide al crear el servicio: escriba una contraseña segura

databases:
  - name: vacunacion-db
    plan: free
    region: oregon
    databaseName: vacunacion
