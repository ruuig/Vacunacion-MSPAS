# Despliegue en Render (plan gratuito): un servicio web que sirve la API y el frontend compilado,
# conectado a una base PostgreSQL externa (por ejemplo Neon, gratis). En Render: Blueprints → New Blueprint Instance.
services:
  - type: web
    name: vacunacion-mspas
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci
    startCommand: cd backend && npm run db:preparar && npm start
    healthCheckPath: /api/auth/ping
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # dirección de la base PostgreSQL (Neon u otra); Render la pide al crear el servicio
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USUARIO
        value: admin
      - key: ADMIN_CONTRASENA
        sync: false   # Render la pide al crear el servicio: escriba una contraseña segura

